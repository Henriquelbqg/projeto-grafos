        <div class="card" style="width: 100%">

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ff0000", "id": "Nova Descoberta", "label": "Nova Descoberta", "shape": "dot", "size": 30, "title": "\u003cb\u003eNova Descoberta\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 1/9"}, {"color": "#ff6666", "id": "Alto Do Mandu", "label": "Alto Do Mandu", "shape": "dot", "size": 20, "title": "\u003cb\u003eAlto Do Mandu\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 2/9"}, {"color": "#ff6666", "id": "Apipucos", "label": "Apipucos", "shape": "dot", "size": 20, "title": "\u003cb\u003eApipucos\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 3/9"}, {"color": "#ff6666", "id": "Iputinga", "label": "Iputinga", "shape": "dot", "size": 20, "title": "\u003cb\u003eIputinga\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 4/9"}, {"color": "#ff6666", "id": "Curado", "label": "Curado", "shape": "dot", "size": 20, "title": "\u003cb\u003eCurado\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 5/9"}, {"color": "#ff6666", "id": "San Martin", "label": "San Martin", "shape": "dot", "size": 20, "title": "\u003cb\u003eSan Martin\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 6/9"}, {"color": "#ff6666", "id": "Afogados", "label": "Afogados", "shape": "dot", "size": 20, "title": "\u003cb\u003eAfogados\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 7/9"}, {"color": "#ff6666", "id": "Imbiribeira", "label": "Imbiribeira", "shape": "dot", "size": 20, "title": "\u003cb\u003eImbiribeira\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 8/9"}, {"color": "#ff0000", "id": "Boa Viagem", "label": "Boa Viagem", "shape": "dot", "size": 30, "title": "\u003cb\u003eBoa Viagem\u003c/b\u003e\u003cbr\u003ePosi\u00e7\u00e3o no caminho: 9/9"}]);
                  edges = new vis.DataSet([{"color": "#ff0000", "from": "Nova Descoberta", "title": "Nova Descoberta \u2192 Alto Do Mandu", "to": "Alto Do Mandu", "width": 5}, {"color": "#ff0000", "from": "Alto Do Mandu", "title": "Alto Do Mandu \u2192 Apipucos", "to": "Apipucos", "width": 5}, {"color": "#ff0000", "from": "Apipucos", "title": "Apipucos \u2192 Iputinga", "to": "Iputinga", "width": 5}, {"color": "#ff0000", "from": "Iputinga", "title": "Iputinga \u2192 Curado", "to": "Curado", "width": 5}, {"color": "#ff0000", "from": "Curado", "title": "Curado \u2192 San Martin", "to": "San Martin", "width": 5}, {"color": "#ff0000", "from": "San Martin", "title": "San Martin \u2192 Afogados", "to": "Afogados", "width": 5}, {"color": "#ff0000", "from": "Afogados", "title": "Afogados \u2192 Imbiribeira", "to": "Imbiribeira", "width": 5}, {"color": "#ff0000", "from": "Imbiribeira", "title": "Imbiribeira \u2192 Boa Viagem", "to": "Boa Viagem", "width": 5}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "stabilization": {"iterations": 100}}, "configure": {"enabled": false}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
